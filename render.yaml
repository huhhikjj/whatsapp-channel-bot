services:
  - type: web
    name: whatsapp-channel-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: whatsapp-session-data
      mountPath: /app/auth_info_baileys
      sizeGB: 1
